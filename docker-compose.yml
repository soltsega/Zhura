version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zhura-db
    environment:
      POSTGRES_USER: zhura
      POSTGRES_PASSWORD: zhura_secret
      POSTGRES_DB: zhura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhura -d zhura_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhura-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://zhura:zhura_secret@postgres:5432/zhura_db
      USE_MOCK_BLOCKCHAIN: "true"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhura-web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  blockchain:
    image: node:20-alpine
    container_name: zhura-chain
    working_dir: /app
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
    command: npx hardhat node

volumes:
  postgres_data:
